<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>skyline</title><script src="/p5.min.js"></script><style>html,body{margin:0;padding:0;background:#2b2b2b;overflow:hidden}canvas{display:block;max-width:100%;height:auto!important;margin:0 auto}</style></head><body><script>
let linePositions = [];

function setup() {
  createCanvas(400, 400); // Changed from 400 to 300
  for (let i = 0; i < 50; i++) {
    linePositions.push(random(height));
  }
}

function draw() {
  background(200);
  for (let i = 0; i < 50; i++) {
    strokeWeight(1);
    stroke(random(255), random(255), random(255));
    line(linePositions[i], 0, linePositions[i], height * 2); // Changed from height to height * 2
  }
}
</script></body></html>
