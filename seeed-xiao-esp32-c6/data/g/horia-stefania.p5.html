<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>horia-stefania</title><script src="/p5.min.js"></script><style>html,body{margin:0;padding:0;background:#2b2b2b;overflow:hidden}canvas{display:block;max-width:100%;height:auto!important;margin:0 auto}</style></head><body><script>
let treeHeight = 200;
let treeWidth = 150;

function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(200);

  // Draw trunk
  fill(80, 30, 30);
  rect(width / 2 - treeWidth / 2, height - treeHeight, treeWidth, treeHeight);

  // Draw leaves
  fill(150, 150, 150);
  ellipse(width / 2 - treeWidth / 4, height - treeHeight + 30, 60, 80);
  ellipse(width / 2 + treeWidth / 4, height - treeHeight + 30, 60, 80);

  // Draw cloud
  fill(255, 255, 210);
  ellipse(width / 2 - 100, height - 100, 200, 100);

  // Draw cow
  fill(200, 180, 160);
  ellipse(width / 2 - 50, height - 30, 50, 30);
}
</script></body></html>
