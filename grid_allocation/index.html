<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Archive</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #2b2b2b;      
      }

      p, h1, h2, h3, h4, h5, h6, body {
        font-family: 'helvetica', sans-serif;
        color: rgb(46, 46, 46);
      }

      .non_select {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      * {
        box-sizing: border-box;
      }

      .thumb_container {
        padding: 0;
        margin: 100px 0px;
      }

      .row {
        padding: 0;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        
        max-width: 1200px; /* Adjust to desired grid limit */
        margin: 0 auto;    /* Centers the container itself */
      }

      .image_container {
        margin: 10px;
        position: relative;
        width: auto;
        min-width: 300px;
        height: auto;
        min-height: 300px;
        overflow: hidden;
      }

      .image_container img {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: auto;
        transform: translate(-50%, -50%);
      }

      .image_container {
        width: auto;
        height: 100%;
      }

      .image_container .after {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: rgb(63, 63, 63);
        text-align: center;
        background: rgb(78 80 89);
        opacity: 1;
        transition: .2s ease-out;
        border: 1px solid #56565694;
        cursor: pointer;
        border-radius: 25px;
      }

      .image_container:hover .after {
        background: rgba(226, 226, 226, 0);
      }

      .image_container .after p {
        position: absolute; 
        width: 100%;     
        top: 50%;
        left: 0%;
        transform: translate(0%, -50%);
        font-size: 100%;
        padding: 10px; 
        color: #111;
        text-align: center;
        cursor: pointer;
        margin: 0;
      }

      @media screen and (max-width: 600px) {
        .thumb_container {
          margin: 80px 50px;
        }

        .image_container {
          width: 180px;
          height: 180px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Photo Grid -->
    <div class="thumb_container"> 
      <div class="row">
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
        <div class="image_container"><div class="after"><p></p></div></div>
      </div>
    </div>  

    <script>
      const allContainers = document.getElementsByClassName("image_container");

      for (let i = 0; i < allContainers.length; i++) {
        allContainers[i].addEventListener("click", function() {
          location.href = "index.html";
        });
      }
    </script>
  </body>
</html>
